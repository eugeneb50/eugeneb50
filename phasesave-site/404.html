<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — PhaseSave</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#171209" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("ps-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dusk" : "day";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "day"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="section" style="min-height:100vh;display:grid;place-items:center;text-align:center;">
    <div class="container">
      <p class="eyebrow" style="justify-content:center;">Lost in the desert</p>
      <h1 style="font-size:clamp(48px,8vw,110px);margin-bottom:18px;">404</h1>
      <p style="color:var(--ink-2);max-width:460px;margin:0 auto 30px;">That page has drifted off like a heat haze. Let's get you back to solid ground.</p>
      <a class="btn btn--primary" href="index.html">Back to PhaseSave
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
